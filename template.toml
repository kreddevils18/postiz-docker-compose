# Import helpers are evaluated by Dokploy; no generated secrets are stored here.
[variables]
main_domain = "${domain}"
jwt_secret = "${base64:32}"
db_password = "${hash:64}"
temporal_password = "${hash:64}"

[config]
env = [
  "POSTIZ_HOST=${main_domain}",
  "JWT_SECRET=${jwt_secret}",
  "DB_USER=postiz",
  "DB_PASSWORD=${db_password}",
  "DB_NAME=postiz",
  "TEMPORAL_USER=temporal",
  "TEMPORAL_PASSWORD=${temporal_password}",
  "IS_GENERAL=true",
  "DISABLE_REGISTRATION=false",
  "RUN_CRON=true",
  "STORAGE_PROVIDER=cloudflare",
  "CLOUDFLARE_REGION=auto",
  "MASTODON_URL=https://mastodon.social",
  "API_LIMIT=30",
  "FEE_AMOUNT=0.05",
  "NX_ADD_PLUGINS=false",
  "CLOUDFLARE_ACCOUNT_ID=",
  "CLOUDFLARE_ACCESS_KEY=",
  "CLOUDFLARE_SECRET_ACCESS_KEY=",
  "CLOUDFLARE_BUCKETNAME=",
  "CLOUDFLARE_BUCKET_URL=",
  "X_API_KEY=",
  "X_API_SECRET=",
  "LINKEDIN_CLIENT_ID=",
  "LINKEDIN_CLIENT_SECRET=",
  "REDDIT_CLIENT_ID=",
  "REDDIT_CLIENT_SECRET=",
  "GITHUB_CLIENT_ID=",
  "GITHUB_CLIENT_SECRET=",
  "BEEHIIVE_API_KEY=",
  "BEEHIIVE_PUBLICATION_ID=",
  "THREADS_APP_ID=",
  "THREADS_APP_SECRET=",
  "FACEBOOK_APP_ID=",
  "FACEBOOK_APP_SECRET=",
  "YOUTUBE_CLIENT_ID=",
  "YOUTUBE_CLIENT_SECRET=",
  "TIKTOK_CLIENT_ID=",
  "TIKTOK_CLIENT_SECRET=",
  "PINTEREST_CLIENT_ID=",
  "PINTEREST_CLIENT_SECRET=",
  "DRIBBBLE_CLIENT_ID=",
  "DRIBBBLE_CLIENT_SECRET=",
  "DISCORD_CLIENT_ID=",
  "DISCORD_CLIENT_SECRET=",
  "DISCORD_BOT_TOKEN_ID=",
  "SLACK_ID=",
  "SLACK_SECRET=",
  "SLACK_SIGNING_SECRET=",
  "MASTODON_CLIENT_ID=",
  "MASTODON_CLIENT_SECRET=",
  "OPENAI_API_KEY=",
  "NEXT_PUBLIC_DISCORD_SUPPORT=",
  "NEXT_PUBLIC_POLOTNO=",
  "STRIPE_PUBLISHABLE_KEY=",
  "STRIPE_SECRET_KEY=",
  "STRIPE_SIGNING_KEY=",
  "STRIPE_SIGNING_KEY_CONNECT=",
  "INSTAGRAM_APP_ID=",
  "INSTAGRAM_APP_SECRET=",
]

[[config.domains]]
serviceName = "postiz"
port = 5000
host = "${main_domain}"
path = "/"

[[config.mounts]]
filePath = "temporal/development-sql.yaml"
content = """
limit.maxIDLength:
  - value: 255
    constraints: {}
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev setup only. Please don't turn this on in production.
    constraints: {}"""
